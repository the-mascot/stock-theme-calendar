# ---------------------------------------------------------------- 집계 설정
aggregation:
  method: mean            # 단순평균 (시총가중은 대장주에 묻혀서 안 씀)
  outlier_clip: 29.0      # 상하한가급 이상치 절사 (%)
  min_valid_ratio: 0.6    # 바스켓 유효 비율이 이 미만이면 해당일 null
  top_n: 5                # 툴팁에 보여줄 테마 내 상위 종목 수
  relative_to: kospi      # rel = 바스켓 평균 - 이 지수의 등락률


# ---------------------------------------------------------------- 지수
# market_indicator: /api/v1/market-indicators/{symbol}/candles
# stock:            /api/v1/candles?symbol=
indices:
  - id: kospi
    name: 코스피
    source: market_indicator
    symbol: "KOSPI"
  - id: kosdaq
    name: 코스닥
    source: market_indicator
    symbol: "KOSDAQ"
  - id: nasdaq
    name: 나스닥
    source: stock
    symbol: "QQQ"         # 나스닥 지수는 market-indicators 미지원 → 나스닥100 ETF 대체
    prev_session: true    # 한국 날짜 d 에는 d 직전 미국 세션을 붙임


# ---------------------------------------------------------------- 백필
backfill:
  default_period: "2y"
  output_dir: "docs/data"