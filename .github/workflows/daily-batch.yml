name: 일일 배치

on:
  schedule:
    # KST 20:10 = UTC 11:10, 평일만.
    # 등락률 분자가 KRX 애프터마켓 종가(20:00)라 그게 확정된 뒤에 돌려야 한다.
    # (예전 16:00 실행은 애프터마켓이 진행 중이라 미확정 값을 집는다)
    - cron: '10 11 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-batch
  cancel-in-progress: false

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 의존성 설치
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q requests pyyaml

      - name: 배치 실행
        env:
          TOSS_CLIENT_ID: ${{ secrets.TOSS_CLIENT_ID }}
          TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
        run: .venv/bin/python Build.py --daily

      - name: 변경분 커밋 · 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data; then
            echo "변경 없음 — 커밋 스킵"
            exit 0
          fi
          git add data
          git commit -m "data: 일일 배치 갱신 $(date -u +%Y-%m-%d)"
          git push