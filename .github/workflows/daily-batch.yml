name: 일일 배치

on:
  schedule:
    # KST 16:00 이후(장 마감 확정 후) = UTC 07:00, 평일만
    - cron: '0 7 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-batch
  cancel-in-progress: false

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 의존성 설치
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q requests pyyaml

      - name: 배치 실행
        env:
          TOSS_CLIENT_ID: ${{ secrets.TOSS_CLIENT_ID }}
          TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
        run: .venv/bin/python Build.py --daily

      - name: 변경분 커밋 · 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data; then
            echo "변경 없음 — 커밋 스킵"
            exit 0
          fi
          git add data
          git commit -m "data: 일일 배치 갱신 $(date -u +%Y-%m-%d)"
          git push