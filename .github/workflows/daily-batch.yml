name: 일일 배치

on:
  # 트리거는 Lightsail 크론 → scripts/dispatch-batch.sh 뿐이다.
  # GitHub schedule은 4~6시간씩 밀려서(2026-09-21~22 실측) 뺐다. 러너가 같은 서버라
  # 서버가 죽으면 schedule로 깨워도 돌 곳이 없으니 예비로도 의미가 없다.
  #
  # 평일 하루 두 번. 앞 회차는 잠정, 뒤 회차가 확정이다.
  #
  # KST 15:40 — 정규장(15:30) 마감 직후.
  # last_complete_date() 가 regularMarket.endTime 으로 판정하니 당일이 잡힌다.
  # 다만 이 시점 일봉 closePrice 는 애프터마켓 진행 중이라 사실상 정규장 종가다
  # (분모는 전일 정규장 종가 — Build.py REGULAR_CLOSE_FROM 주석 참고).
  # 그래서 이 회차 값은 '정규장 기준 등락률'이고, 저녁 회차가 덮어쓴다.
  #
  # KST 20:10 — 애프터마켓(20:00) 마감 후.
  # 등락률 분자가 애프터마켓 종가라 이 회차 값이 토스 앱 표시와 일치하는 확정치다.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-batch
  cancel-in-progress: false

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 의존성 설치
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q requests pyyaml

      - name: 배치 실행
        env:
          TOSS_CLIENT_ID: ${{ secrets.TOSS_CLIENT_ID }}
          TOSS_CLIENT_SECRET: ${{ secrets.TOSS_CLIENT_SECRET }}
        run: .venv/bin/python Build.py --daily

      - name: 변경분 커밋 · 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data; then
            echo "변경 없음 — 커밋 스킵"
            exit 0
          fi
          git add data
          git commit -m "data: 일일 배치 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
          git push